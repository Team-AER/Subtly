[workspace]
resolver = "2"
members = [
    "crates/subtly-core",
    "crates/subtly-ui",
    "crates/xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Prakhar Shukla <prafiles@gmail.com>"]
homepage = "https://subtly.aer.app"
repository = "https://github.com/prakhar1989/Subtly"

[workspace.dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "process", "io-util", "fs", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "1"
directories = "5"
num_cpus = "1"
walkdir = "2"
tempfile = "3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
futures = "0.3"
once_cell = "1"
sentry = { version = "0.34", default-features = false, features = ["backtrace", "panic", "rustls", "reqwest"] }
single-instance = "0.3"
uuid = { version = "1", features = ["v4"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

# cargo-dist configuration. Run `cargo dist init` and `cargo dist build` to
# produce signed releases that axoupdater can consume.
[workspace.metadata.dist]
cargo-dist-version = "0.22.1"
ci = ["github"]
installers = ["shell", "powershell"]
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
]
publish-jobs = ["homebrew"]
pr-run-mode = "plan"

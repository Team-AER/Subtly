name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  build:
    name: Build (${{ matrix.os }} / ${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            arch: arm64
            target: aarch64-apple-darwin
            artifact-glob: |
              release/*.dmg
              release/*.app.tar.gz
          - os: ubuntu-22.04
            arch: amd64
            target: x86_64-unknown-linux-gnu
            artifact-glob: |
              release/*.AppImage
              release/*.deb
          - os: windows-2022
            arch: amd64
            target: x86_64-pc-windows-msvc
            artifact-glob: |
              release/*.exe
              release/*.msi

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install system dependencies (Linux)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake pkg-config build-essential \
            libasound2-dev libudev-dev \
            libxcb-xinput0 libxcb-xinerama0 libxcb-cursor-dev \
            libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            libfuse2 libssl-dev

      - name: Install system dependencies (macOS)
        if: matrix.os == 'macos-14'
        run: |
          brew install cmake pkg-config

      - name: Install system dependencies (Windows)
        if: matrix.os == 'windows-2022'
        shell: pwsh
        run: |
          choco install -y cmake pkgconfiglite --allow-empty-checksums

      - name: Install Vulkan SDK (Linux)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          SDK_VERSION=$(curl -s https://vulkan.lunarg.com/sdk/latest/linux.txt)
          curl -L -o vulkan_sdk.tar.xz "https://sdk.lunarg.com/sdk/download/${SDK_VERSION}/linux/vulkan_sdk.tar.xz"
          tar xf vulkan_sdk.tar.xz
          SDK_DIR="${PWD}/${SDK_VERSION}/x86_64"
          echo "VULKAN_SDK=${SDK_DIR}" >> "$GITHUB_ENV"
          echo "${SDK_DIR}/bin" >> "$GITHUB_PATH"
          echo "LD_LIBRARY_PATH=${SDK_DIR}/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=${SDK_DIR}/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}" >> "$GITHUB_ENV"

      - name: Install Vulkan SDK (Windows)
        if: matrix.os == 'windows-2022'
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP "vulkan_sdk.exe"
          Invoke-WebRequest -Uri "https://sdk.lunarg.com/sdk/download/latest/windows/vulkan_sdk.exe" -OutFile $installer
          & $installer --accept-licenses --default-answer --confirm-command install
          $vk = $env:VULKAN_SDK
          if (-not $vk) {
            $vk = (Get-ChildItem "C:\VulkanSDK" -Directory | Sort-Object Name -Descending | Select-Object -First 1).FullName
          }
          if (-not $vk) {
            throw "Vulkan SDK not found after install"
          }
          "VULKAN_SDK=$vk" | Out-File -FilePath $env:GITHUB_ENV -Append
          "$vk\Bin" | Out-File -FilePath $env:GITHUB_PATH -Append
          "$vk\Bin32" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry & build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: build-${{ matrix.os }}
          cache-on-failure: true

      - name: Install cargo-packager
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-packager

      - name: Download bundled assets (ffmpeg, VAD model)
        run: cargo run -p xtask --release -- download-assets

      - name: Build whisper-cli (Unix)
        if: matrix.os != 'windows-2022'
        run: bash scripts/build-whisper.sh

      - name: Build whisper-cli (Windows)
        if: matrix.os == 'windows-2022'
        shell: bash
        run: bash scripts/build-whisper.sh

      - name: Stage whisper-cli binary (Unix)
        if: matrix.os != 'windows-2022'
        run: |
          mkdir -p resources/runtime-assets/bin
          for candidate in deps/whisper.cpp/build/bin/whisper-cli deps/whisper.cpp/build/bin/Release/whisper-cli; do
            if [ -f "$candidate" ]; then
              cp "$candidate" resources/runtime-assets/bin/whisper-cli
              chmod +x resources/runtime-assets/bin/whisper-cli
              echo "Staged $candidate"
              exit 0
            fi
          done
          echo "whisper-cli binary not found" >&2
          exit 1

      - name: Stage whisper-cli binary (Windows)
        if: matrix.os == 'windows-2022'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path resources\runtime-assets\bin | Out-Null
          $candidates = @(
            "deps\whisper.cpp\build\bin\Release\whisper-cli.exe",
            "deps\whisper.cpp\build\bin\whisper-cli.exe"
          )
          foreach ($c in $candidates) {
            if (Test-Path $c) {
              Copy-Item $c "resources\runtime-assets\bin\whisper-cli.exe" -Force
              Write-Host "Staged $c"
              exit 0
            }
          }
          Write-Error "whisper-cli.exe not found"
          exit 1

      - name: Build subtly-ui (release)
        run: cargo build --release -p subtly-ui --target ${{ matrix.target }}

      - name: Validate macOS Signing & Notarization Secrets
        if: matrix.os == 'macos-14'
        env:
          # CSC_LINK / CSC_KEY_PASSWORD follow the electron-builder /
          # cargo-packager convention: base64-encoded .p12 + its password.
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # Identity can come from either the imported P12 (preferred,
          # auto-derived in the cert-import step) OR an explicit
          # APPLE_SIGNING_IDENTITY secret. We need at least one.
          missing=0
          if [ -z "$CSC_LINK" ] && [ -z "$APPLE_SIGNING_IDENTITY" ]; then
            echo "::warning::No signing identity available (need CSC_LINK + CSC_KEY_PASSWORD, or APPLE_SIGNING_IDENTITY) — packaging will be unsigned"
            missing=1
          fi
          if [ -n "$CSC_LINK" ] && [ -z "$CSC_KEY_PASSWORD" ]; then
            echo "::warning::CSC_LINK set but CSC_KEY_PASSWORD missing — keychain import will fail"
            missing=1
          fi
          for v in APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [ -z "$(eval echo \$$v)" ]; then
              echo "::warning::Missing $v — notarization will be skipped"
              missing=1
            fi
          done
          if [ "$missing" -eq 0 ]; then
            echo "✓ All macOS signing & notarization secrets present"
          fi

      - name: Import macOS signing certificate
        if: matrix.os == 'macos-14'
        env:
          # CSC_LINK is either a base64-encoded .p12 (most common for CI),
          # an https:// URL, a file:// URL, or a local filesystem path.
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          if [ -z "$CSC_LINK" ]; then
            echo "::warning::CSC_LINK not set — skipping keychain import; build will be unsigned"
            exit 0
          fi
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          CERT_PATH="$RUNNER_TEMP/cert.p12"

          case "$CSC_LINK" in
            https://*|http://*)
              echo "• Fetching CSC_LINK from URL"
              curl -fsSL "$CSC_LINK" -o "$CERT_PATH"
              ;;
            file://*)
              cp "${CSC_LINK#file://}" "$CERT_PATH"
              ;;
            /*)
              cp "$CSC_LINK" "$CERT_PATH"
              ;;
            *)
              echo "• Decoding CSC_LINK as base64"
              echo "$CSC_LINK" | base64 --decode > "$CERT_PATH"
              ;;
          esac

          # Sanity-check the decoded file is actually a PKCS#12 archive — if
          # it's not, security import emits a vague error that's easy to
          # misread as a credential problem.
          if ! file "$CERT_PATH" | grep -qiE 'data|pkcs'; then
            echo "::error::CSC_LINK did not produce a readable file at $CERT_PATH"
            file "$CERT_PATH" || true
            exit 1
          fi

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$CSC_KEY_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" >/dev/null

          # Notarization requires a "Developer ID Application" cert. Apple
          # Development / Distribution / Installer certs sign successfully but
          # the notary service rejects the result with status: Invalid.
          IDENTITY_NAME="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
            | awk -F '"' '/Developer ID Application/ { print $2; exit }')"
          if [ -z "$IDENTITY_NAME" ]; then
            echo "::error::Imported P12 does not contain a 'Developer ID Application' identity. Notarization will fail."
            security find-identity -v -p codesigning "$KEYCHAIN_PATH" || true
            exit 1
          fi
          echo "✓ Developer ID Application identity present: $IDENTITY_NAME"

          # Auto-derive APPLE_SIGNING_IDENTITY for downstream steps so the
          # user only needs to provide the P12 — the identity string can't
          # drift from what's actually in the keychain.
          if [ -z "${APPLE_SIGNING_IDENTITY:-}" ]; then
            echo "APPLE_SIGNING_IDENTITY=$IDENTITY_NAME" >> "$GITHUB_ENV"
            echo "✓ Exported APPLE_SIGNING_IDENTITY (auto-derived) to subsequent steps"
          else
            echo "✓ APPLE_SIGNING_IDENTITY already set explicitly — leaving as-is"
          fi

      - name: Package application (Linux/Windows)
        if: matrix.os != 'macos-14'
        run: cargo packager --release --target ${{ matrix.target }}

      - name: Package .app and notarize (macOS)
        if: matrix.os == 'macos-14'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # APPLE_SIGNING_IDENTITY is inherited from the env exported by the
          # cert-import step (either auto-derived from the P12 or passed
          # through from the secret). Fail fast if we're going to attempt
          # notarization but have no identity — better than discovering it
          # via a guaranteed-Invalid notarytool round-trip.
          if [ -n "$APPLE_ID" ] && [ -z "${APPLE_SIGNING_IDENTITY:-}" ]; then
            echo "::error::Notarization credentials are set but APPLE_SIGNING_IDENTITY is empty (no P12 imported and no identity secret). Provide APPLE_CERTIFICATE_P12 + APPLE_CERTIFICATE_PASSWORD, or set APPLE_SIGNING_IDENTITY explicitly."
            exit 1
          fi

          # Phase 1: build the .app bundle (signed if APPLE_SIGNING_IDENTITY is set).
          cargo packager --release --target ${{ matrix.target }} --formats app

          shopt -s nullglob
          apps=(release/*.app)
          if [ ${#apps[@]} -eq 0 ]; then
            echo "::error::cargo-packager produced no .app bundle"
            exit 1
          fi

          # Phase 2a: deep-sign every nested Mach-O with hardened runtime +
          # entitlements + secure timestamp. cargo-packager signs the main
          # binary but does NOT propagate hardened runtime to bundled
          # executables (whisper-cli, ffmpeg) or dylibs — Apple's notary
          # rejects any unsigned/non-hardened Mach-O inside the bundle.
          if [ -n "$APPLE_SIGNING_IDENTITY" ]; then
            ENTITLEMENTS="$GITHUB_WORKSPACE/resources/entitlements.mac.plist"
            for app in "${apps[@]}"; do
              echo "• Deep-signing nested binaries inside $app"
              # Find every Mach-O file (executables + dylibs) inside the bundle.
              # `file` reliably identifies Mach-O regardless of extension.
              while IFS= read -r -d '' f; do
                if file "$f" | grep -q 'Mach-O'; then
                  echo "  signing $f"
                  codesign --force --options runtime --timestamp \
                           --entitlements "$ENTITLEMENTS" \
                           --sign "$APPLE_SIGNING_IDENTITY" \
                           "$f"
                fi
              done < <(find "$app/Contents" -type f -print0)

              # Re-sign the outer bundle so its CodeDirectory covers the new
              # inner signatures. Without this the bundle signature is stale.
              echo "• Re-signing outer bundle $app"
              codesign --force --options runtime --timestamp \
                       --entitlements "$ENTITLEMENTS" \
                       --sign "$APPLE_SIGNING_IDENTITY" \
                       "$app"

              # Sanity-check: all signatures must verify before we waste a
              # notarization round-trip.
              codesign --verify --deep --strict --verbose=2 "$app"
            done
          else
            echo "::warning::APPLE_SIGNING_IDENTITY not set — skipping deep-sign sweep"
          fi

          # Phase 2b: zip → submit → staple each .app (xtask notarize handles the zip step).
          if [ -n "$APPLE_ID" ] && [ -n "$APPLE_APP_SPECIFIC_PASSWORD" ] && [ -n "$APPLE_TEAM_ID" ]; then
            for app in "${apps[@]}"; do
              cargo run -p xtask --release -- notarize "$app"
            done
          else
            echo "::warning::Skipping .app notarization — Apple credentials not provided"
          fi

      - name: Package .dmg and notarize (macOS)
        if: matrix.os == 'macos-14'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          apps=(release/*.app)
          if [ ${#apps[@]} -eq 0 ]; then
            echo "::error::No signed .app found in release/ — .app phase must have succeeded"
            exit 1
          fi
          APP="${apps[0]}"

          VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*= *"\(.*\)"/\1/')
          ARCH=$(echo "${{ matrix.target }}" | cut -d- -f1)
          DMG="release/Subtly_${VERSION}_${ARCH}.dmg"

          # Phase 3: wrap the already-signed, stapled .app in a DMG using
          # hdiutil directly. We do NOT use `cargo packager --formats dmg`
          # here because cargo-packager rebuilds the .app as an intermediate
          # step, which discards all prior signing work.
          echo "• Creating $DMG from $APP"
          TMP_SRC="$(mktemp -d)"
          trap 'rm -rf "$TMP_SRC"' EXIT
          cp -R "$APP" "$TMP_SRC/"
          ln -s /Applications "$TMP_SRC/Applications"
          hdiutil create \
            -volname "Subtly" \
            -srcfolder "$TMP_SRC" \
            -ov -format UDZO \
            "$DMG"

          # Phase 4: notarize + staple the .dmg so Gatekeeper trusts the
          # disk image offline as well.
          if [ -n "$APPLE_ID" ] && [ -n "$APPLE_APP_SPECIFIC_PASSWORD" ] && [ -n "$APPLE_TEAM_ID" ]; then
            cargo run -p xtask --release -- notarize "$DMG"
          else
            echo "::warning::Skipping .dmg notarization — Apple credentials not provided"
          fi

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: subtly-${{ matrix.os }}-${{ matrix.arch }}
          path: ${{ matrix.artifact-glob }}
          if-no-files-found: warn
